  <script id="matrix-route-bootstrap">
    (() => {
      document.documentElement.setAttribute("data-matrix-route-loading", "true");

      // A failed entry must leave a visible, keyboard-accessible recovery.
      const criticalEntry = (value) => {
        try { return /^\/assets\/(?:index-produto-descricao|matrix-redesign|spa-core-runtime|feature-fixes\/lane-(?:01-plp-filters\/plp-filters|02-plp-windowing\/plp-windowing)|reviews\/loader\.v1)\.js$/.test(new URL(value, location.href).pathname); }
        catch { return false; }
      };
      let bootPending = true;
      let bootFailed = false;
      let bootResourceFailed = false;
      const bootBackground = new Map();
      const showBootFailure = (confirmed = true) => {
        if (confirmed) bootResourceFailed = true;
        if (bootFailed) return;
        bootFailed = true;
        clearTimeout(bootDeadline);
        document.documentElement.dataset.matrixBootError = "true";
        const show = () => {
          if (!bootFailed) return;
          const panel = document.getElementById("matrix-boot-error");
          if (!panel) return;
          panel.hidden = false;
          for (const child of document.body.children) {
            if (child !== panel) {
              bootBackground.set(child, { inert: child.hasAttribute("inert"), aria: child.getAttribute("aria-hidden") });
              child.setAttribute("inert", "");
              child.setAttribute("aria-hidden", "true");
            }
          }
          const retry = panel.querySelector("button");
          retry.addEventListener("click", () => location.reload(), { once: true });
          retry.addEventListener("keydown", (event) => { if (event.key === "Tab") event.preventDefault(); });
          retry.focus({ preventScroll: true });
        };
        if (document.getElementById("matrix-boot-error")) show();
        else document.addEventListener("DOMContentLoaded", show, { once: true });
      };
      const bootDeadline = setTimeout(() => showBootFailure(false), 18000);
      addEventListener("error", (event) => {
        const resourceFailed = event.target instanceof HTMLScriptElement && criticalEntry(event.target.src);
        const executionFailed = bootPending && criticalEntry(event.filename || "");
        if (resourceFailed || executionFailed) showBootFailure();
      }, true);
      document.addEventListener("DOMContentLoaded", () => {
        bootPending = false;
        clearTimeout(bootDeadline);
        if (bootFailed && !bootResourceFailed) {
          bootFailed = false;
          delete document.documentElement.dataset.matrixBootError;
          const panel = document.getElementById("matrix-boot-error");
          if (panel) { panel.querySelector("button")?.blur(); panel.hidden = true; }
          for (const [child, previous] of bootBackground) {
            if (!previous.inert) child.removeAttribute("inert");
            if (previous.aria === null) child.removeAttribute("aria-hidden");
            else child.setAttribute("aria-hidden", previous.aria);
          }
        }
        bootBackground.clear();
      }, { once: true });
      const BOOT_PARAM = "__matrix_route";
      const nativePushState = history.pushState.bind(history);
      const nativeReplaceState = history.replaceState.bind(history);
      const isSafeInternalRoute = (value) => typeof value === "string" && /^\/(?!\/)/.test(value);
      const routeFamily = () => {
        const path = location.pathname;
        if (path === "/" || path === "/home" || path.startsWith("/busca") || path.startsWith("/produto/")) return "store";
        if (["/carrinho", "/entrega", "/pagamento", "/cartao"].includes(path)) return "checkout";
        return "other";
      };
      const syncRouteFamily = () => {
        const nextFamily = routeFamily();
        if (document.documentElement.dataset.matrixRouteFamily !== nextFamily) {
          document.documentElement.dataset.matrixRouteFamily = nextFamily;
        }
      };
      const bootRoute = new URLSearchParams(location.search).get(BOOT_PARAM);
      if (isSafeInternalRoute(bootRoute)) nativeReplaceState(history.state, "", bootRoute);

      // The first Home campaign is the likely LCP. This early config is also
      // consumed by Matrix, so changing a campaign never creates a second URL.
      const HOME_HERO = Object.freeze({
        src: "https://imgcentauro-a.akamaihd.net/05_Campanhas/2026/DuelodosClassicos/out/MPalxVasEGrexGalo.png",
        alt: "Duelo dos clássicos",
        route: "https://www.centauro.com.br/hotsite/duelos-das-semifinais"
      });
      window.__matrixHomeHero = HOME_HERO;
      if (location.pathname === "/" || location.pathname === "/home") {
        if (!document.head.querySelector("link[data-matrix-home-hero-preload='true']")) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = HOME_HERO.src;
          preload.setAttribute("fetchpriority", "high");
          preload.dataset.matrixHomeHeroPreload = "true";
          document.head.appendChild(preload);
        }
      }

      // Product-to-product uses a clean document for React/Matrix stability.
      // Matrix stores the target hero in sessionStorage before navigating, so
      // this early head bootstrap can start the likely LCP image before the
      // React bundle discovers the <img>.
      try {
        const productId = location.pathname.match(/^\/produto\/(\d+)/)?.[1];
        const storedHero = productId ? sessionStorage.getItem(`matrix:product-hero:${productId}`) : "";
        let hero = storedHero;
        let srcset = "";
        let sizes = "";
        if (storedHero?.startsWith("{")) {
          const parsed = JSON.parse(storedHero);
          hero = String(parsed?.href || "");
          srcset = String(parsed?.srcset || "");
          sizes = String(parsed?.sizes || "");
        }
        if (hero && /^https?:\/\//i.test(hero)) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = hero;
          if (srcset) preload.setAttribute("imagesrcset", srcset);
          if (sizes) preload.setAttribute("imagesizes", sizes);
          preload.setAttribute("fetchpriority", "high");
          preload.dataset.matrixBootHeroPreload = "true";
          document.head.appendChild(preload);
          window.__matrixBootHeroPreload = { href: hero, srcset, sizes };
        }
      } catch {}
      syncRouteFamily();
      history.pushState = (...args) => {
        const result = nativePushState(...args);
        syncRouteFamily();
        return result;
      };
      history.replaceState = (...args) => {
        const result = nativeReplaceState(...args);
        syncRouteFamily();
        return result;
      };
      addEventListener("popstate", syncRouteFamily, { passive: true });
      window.__matrixSyncRouteFamily = syncRouteFamily;
    })();
  </script>

    html[data-matrix-route-family="store"] #root header.fixed.top-0,

  <style id="matrix-route-loading-bootstrap-style">
    /*
      Perf10: usa o mesmo princípio do loader nativo do SPA (fixed + inset:0).
      O overlay cobre a viewport inteira, mas fica um nível abaixo dos headers
      Matrix. Assim não há cálculo de top/altura e o header permanece visível.
    */
    html[data-matrix-route-loading="true"] #root {
      visibility: hidden !important;
      pointer-events: none !important;
    }
    html[data-matrix-route-loading="true"] body {
      background: #fff !important;
      overflow: hidden !important;
    }

    #matrix-route-loading {
      position: fixed !important;
      z-index: 100 !important;
      right: 0 !important;
      bottom: auto !important;
      left: 0 !important;
      display: block !important;
      box-sizing: border-box !important;
      width: 100vw !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: #fff !important;
      pointer-events: auto !important;
      overscroll-behavior: contain;
      isolation: isolate;
    }

    /*
      Perf12: posição determinística. O overlay recebe altura explícita igual ao
      viewport visual menos o header; o GIF é então centralizado por coordenadas
      absolutas dentro dessa caixa. Isso não depende de flex/grid nem de leitura
      de geometria do DOM e funciona igual no Chrome, Android WebView e WKWebView.
    */
    html[data-matrix-route-family="store"] #matrix-route-loading {
      top: var(--matrix-store-header-height, 124px) !important;
      height: calc(100vh - var(--matrix-store-header-height, 124px)) !important;
      height: calc(100dvh - var(--matrix-store-header-height, 124px)) !important;
    }
    html[data-matrix-route-family="checkout"] #matrix-route-loading {
      top: var(--matrix-checkout-header-height, 57px) !important;
      height: calc(100vh - var(--matrix-checkout-header-height, 57px)) !important;
      height: calc(100dvh - var(--matrix-checkout-header-height, 57px)) !important;
    }
    html[data-matrix-route-family="other"] #matrix-route-loading {
      top: 0 !important;
      height: 100vh !important;
      height: 100dvh !important;
    }

    #matrix-route-loading[hidden] { display: none !important; }

    /* Durante uma troca de rota existe exatamente um loader visual. O SPA pode
       ter seu próprio load.gif para add-to-cart; ele continua normal fora do
       estado data-matrix-route-loading. */
    html[data-matrix-route-loading="true"] body img[src*="/assets/load.gif"] {
      visibility: hidden !important;
    }
    html[data-matrix-route-loading="true"] #matrix-route-loading > img {
      visibility: visible !important;
    }

    #matrix-route-loading > img {
      position: absolute !important;
      top: 50% !important;
      right: auto !important;
      bottom: auto !important;
      left: 50% !important;
      display: block !important;
      width: 64px !important;
      height: 64px !important;
      margin: 0 !important;
      object-fit: contain !important;
      transform: translate(-50%, -50%) !important;
    }

    /*
      Os dois headers Matrix já possuem fundo branco. Reforçar o stacking
      somente durante loading garante que o overlay nunca cubra o header,
      sem alterar o visual ou a ordem normal fora da transição.
    */
    html[data-matrix-route-loading="true"] #matrix-store-header {
      /*
        Perf12.1: o header da loja e sticky fora do loading. Quando o loader
        trava o body com overflow:hidden, um sticky visto apos scroll pode
        perder a posicao colada e voltar para o topo real do documento.
        Durante a transicao ele vira fixed para permanecer exatamente no topo;
        ao terminar o loading esta regra deixa de valer e o CSS Matrix volta
        a controlar o header normalmente.
      */
      position: fixed !important;
      top: 0 !important;
      right: 0 !important;
      left: 0 !important;
      width: 100% !important;
      visibility: visible !important;
      opacity: 1 !important;
      transform: none !important;
      z-index: 101 !important;
    }
    html[data-matrix-route-loading="true"] #matrix-checkout-header {
      z-index: 10020 !important;
    }
  </style>
